<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cidade Virtual Online</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; }
        #cidade { position: relative; width: 100vw; height: 80vh; background: #4caf50; border-bottom: 4px solid #333; }
        .avatar { position: absolute; width: 40px; height: 40px; background: #ffeb3b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; transition: 0.1s linear; }
        .balao { position: absolute; top: -25px; background: white; padding: 2px 6px; font-size: 10px; border-radius: 4px; white-space: nowrap; }
        #painel-chat { height: 20vh; background: #111; color: white; padding: 10px; display: flex; flex-direction: column; }
        #mensagens { flex: 1; overflow-y: auto; font-size: 14px; margin-bottom: 5px; }
        input { padding: 8px; }
    </style>
</head>
<body>

    <div id="cidade">
        <!-- Os avatares dos jogadores aparecerão aqui dinamicamente -->
    </div>

    <div id="painel-chat">
        <div id="mensagens"></div>
        <input type="text" id="inputChat" placeholder="Digite sua mensagem e aperte Enter...">
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SUA_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Identidade do Jogador Atual
        const meuId = "user_" + Math.floor(Math.random() * 10000);
        const meuNome = "Player" + Math.floor(Math.random() * 100);
        let posX = 100;
        let posY = 100;

        const meuRef = ref(db, 'cidade/jogadores/' + meuId);
        
        // Remove o jogador do banco quando ele fecha a página
        onDisconnect(meuRef).remove();

        // Envia posição inicial
        set(meuRef, { nome: meuNome, x: posX, y: posY, mensagem: "" });

        // Movimento com as setas do teclado
        window.addEventListener('keydown', (e) => {
            const velocidade = 10;
            if (e.key === 'ArrowUp') posY -= velocidade;
            if (e.key === 'ArrowDown') posY += velocidade;
            if (e.key === 'ArrowLeft') posX -= velocidade;
            if (e.key === 'ArrowRight') posX += velocidade;

            // Atualiza posição no Firebase
            set(meuRef, { nome: meuNome, x: posX, y: posY });
        });

        // Ouve todos os jogadores na cidade em tempo real
        const jogadoresRef = ref(db, 'cidade/jogadores');
        onValue(jogadoresRef, (snapshot) => {
            const dados = snapshot.val();
            const container = document.getElementById('cidade');
            container.innerHTML = ''; // Limpa a tela para redesenhar

            if (dados) {
                for (let id in dados) {
                    let p = dados[id];
                    
                    // Cria o elemento visual do personagem
                    let div = document.createElement('div');
                    div.className = 'avatar';
                    div.style.left = p.x + 'px';
                    div.style.top = p.y + 'px';
                    div.innerText = p.nome.substring(0, 3); // Primeiras letras do nome

                    // Se ele mandou mensagem, mostra um balãozinho
                    if (p.mensagem) {
                        let balao = document.createElement('div');
                        balao.className = 'balao';
                        balao.innerText = p.mensagem;
                        div.appendChild(balao);
                    }

                    container.appendChild(div);
                }
            }
        });

        // Sistema de Chat
        const inputChat = document.getElementById('inputChat');
        inputChat.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && inputChat.value.trim() !== "") {
                let texto = inputChat.value;
                
                // Atualiza a mensagem no nó do próprio jogador para aparecer o balão na cabeça dele
                set(meuRef, { nome: meuNome, x: posX, y: posY, mensagem: texto });

                // Salva também no histórico geral do chat
                push(ref(db, 'cidade/chat'), { nome: meuNome, texto: texto });

                inputChat.value = "";
                
                // Apaga o balão de fala após 4 segundos
                setTimeout(() => {
                    set(meuRef, { nome: meuNome, x: posX, y: posY, mensagem: "" });
                }, 4000);
            }
        });

        // Ouve o histórico de chat geral
        const chatRef = ref(db, 'cidade/chat');
        onValue(chatRef, (snapshot) => {
            const mensagensDiv = document.getElementById('mensagens');
            mensagensDiv.innerHTML = '';
            const msgs = snapshot.val();
            if (msgs) {
                // Pega as últimas mensagens
                let lista = Object.values(msgs).slice(-15); 
                lista.forEach(m => {
                    let p = document.createElement('div');
                    p.innerHTML = `<b>${m.nome}:</b> ${m.texto}`;
                    mensagensDiv.appendChild(p);
                });
                mensagensDiv.scrollTop = mensagensDiv.scrollHeight;
            }
        });
    </script>
</body>
</html>
